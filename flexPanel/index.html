<!-- Flex-Panel Image Gallery -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Panel Image Gallery </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <style>
        html {
            box-sizing: border-box;
            background: #333;
            font-family: 'JetBrains Mono', 'Open Sans';
            font-weight: 200;
            font-size: 20px;
        }

        body {
            margin: 0;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        .panels {
            min-height: 100vh;
            overflow: hidden;
            display: flex;

        }

        .panel {
            background: #5555;
            box-shadow: inset 0 0 5px;
            color: white;
            text-align: center;
            align-items: center;
            transition:
                font-size 0.7s cubic-bezier(0.61, -0.19, 0.7, -0.11) ,
                flex 0.7s cubic-bezier(0.61, -0.19, 0.7, -0.11),
                background 0.2s;
            font-size: 20px;
            background-size: cover;
            background-position: center;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .panel1 {
            background-image: url(https://plus.unsplash.com/premium_photo-1691434474131-01f982a2dab1?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8c2NlbmVyeXxlbnwwfHwwfHx8MA%3D%3D);

        }

        .panel2 {
            background-image: url(https://plus.unsplash.com/premium_photo-1677347335105-1bd16607a25e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8c2NlbmVyeXxlbnwwfHwwfHx8MA%3D%3D);

        }

        .panel3 {
            background-image: url(https://images.unsplash.com/photo-1433086966358-54859d0ed716?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);

        }

        .panel4 {
            background-image: url(https://images.unsplash.com/photo-1529419412599-7bb870e11810?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);

        }

        .panel5 {
            background-image: url(https://plus.unsplash.com/premium_photo-1673292293042-cafd9c8a3ab3?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);

        }

      /*Flex-Children */
      /* .panel> *  to select the immediate chilf of an element with the class name panel*/
        .panel> * {
            margin: 0;
            width: 100%;
            transition: transform 0.5s;
            flex: 1 0 auto;
            display:flex;
            justify-content: center;
            align-items: center;
           
        }

        .panel> *:last-child {
            transform: translateY(100%);
        }

        .panel.open-active> *:last-child {
            transform: translateY(0);
        }

        .panel p {
            text-transform: uppercase;
            font-family: 'JetBrains Mono', 'Open Sans';
            text-shadow: 0 0 4px rgba(35, 34, 34, 0.72), 0 0 14px rgba(0, 0, 0, 0.45);
            font-size: 2em;

        }

        .panel p:nth-child(2) {
            font-size: 3em;

        }

        .panel.open {
            flex: 5;/*Its going to take five times the amount of extra room*/
            font-size: 40px;
        }

        @media only screen and (max-width:600px) {
            .panel p {
                font-size: 1em;
            }
        }
    </style>
</head>

<body>
    <div class="panels">
        <div class="panel1 panel">
            <p>Dream</p>
            <p>Big</p>
        </div>
        <div class="panel2 panel">
            <p>Stay</p>
            <p>Humble</p>
        </div>
        <div class="panel3 panel">
            <p>Move</p>
            <p>Forward</p>
        </div>
        <div class="panel4 panel">
            <p>Accept</p>
            <p>Failures</p>
        </div>
        <div class="panel5 panel">
            <p>Rise</p>
            <p>Stronger</p>

        </div>
      
    </div>
    <script>
        const panels = document.querySelectorAll(".panel")
        function toggleOpen() {
         this.classList.toggle("open")
        }
        function toggleActive(e) {
            if (e.propertyName.includes('flex')) {
                this.classList.toggle("open-active")
            }
        }
        panels.forEach(panel => panel.addEventListener("click", toggleOpen))
        panels.forEach(panel => panel.addEventListener("transitionend", toggleActive))
    </script>

</body>

</html>
